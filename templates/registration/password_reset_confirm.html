{% extends "base.html" %}
{% block title %}Set Password | Bookly{% endblock %}
{% block content %}
<section class="auth-layout single">
  <div class="auth-panel reveal">
    <span class="eyebrow">New credentials</span>
    <h1>Set a fresh password.</h1>
    <form method="post" class="form-grid">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn-primary" type="submit">Update password</button>
    </form>
  </div>
</section>
{% endblock %}
